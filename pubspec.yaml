name: screen_time_api_ios
description: A Flutter plugin for using iOS ScreenTime API
version: 0.0.5
homepage: https://github.com/kboy-silvergym/screen_time_api_ios

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ScreenTimeApiIosPlugin

# This package supports only iOS.
platforms:
  ios:
